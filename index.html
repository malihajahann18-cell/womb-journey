<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journey of Life – From Conception to Birth</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#fff7f5;--fg:#3b1f2b;--card:#ffffffcc;--accent:#e11d6a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0f16;--fg:#fde8ee;--card:#2a1822cc;--accent:#ff6fa5}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
#stage{position:relative;height:55%;min-height:260px}
canvas{display:block;width:100%;height:100%}
.card{background:var(--card);backdrop-filter:blur(8px);border-radius:16px}
input[type=range]{accent-color:var(--accent);width:100%}
.btn{background:var(--accent);color:#fff;border-radius:999px;padding:.4rem 1rem;font-weight:600}
</style>
</head>
<body class="flex flex-col">
<div id="stage">
  <canvas id="c"></canvas>
  <div class="absolute top-2 left-3 right-3 flex justify-between items-start pointer-events-none">
    <div class="card px-3 py-1 text-sm font-semibold" id="stageName">Fertilization</div>
    <div class="card px-3 py-1 text-sm" id="sizeTag"></div>
  </div>
  <div class="absolute bottom-2 left-3 text-xs opacity-70">Drag to rotate</div>
</div>
<div class="flex-1 overflow-y-auto p-3 space-y-3">
  <div class="card p-3">
    <div class="flex justify-between text-sm mb-1"><span>Week <b id="wk">0</b> of 40</span><span id="tri"></span></div>
    <input id="slider" type="range" min="0" max="40" value="0">
    <div class="flex gap-2 mt-2">
      <button class="btn text-sm" id="play">▶ Auto play</button>
      <button class="btn text-sm" id="spdBtn">Speed: 1x</button><button class="btn text-sm" id="orgBtn">Organs: Off</button><button class="btn text-sm" id="quizBtn">Quiz</button>
    </div>
  </div>
  <div class="card p-3">
    <h2 class="font-bold text-lg" id="title"></h2>
    <p class="text-sm mt-1" id="desc"></p>
    <p class="text-xs mt-2 opacity-80" id="fact"></p><p class="text-sm mt-2 font-semibold" id="orgInfo" style="color:var(--accent)"></p>
  </div>
  <div class="card p-3 hidden" id="quiz"></div>
</div>
<script>
const S=[
{w:0,n:"Fertilization",t:"Sperm race to the egg",d:"Millions of sperm swim toward the egg in the fallopian tube. Only one fuses with it, forming a zygote with 46 chromosomes.",f:"Size: 0.1 mm, about a grain of salt.",s:.1,k:"salt grain"},
{w:2,n:"Implantation",t:"Embryo attaches to the womb",d:"The zygote divides into a ball of cells (blastocyst) and burrows into the uterine lining. The placenta starts to form.",f:"Hormone hCG begins to rise, which pregnancy tests detect.",s:.2,k:"poppy seed"},
{w:5,n:"Embryo",t:"Heart starts beating",d:"The neural tube forms the brain and spinal cord. A tiny heart starts to beat and tiny limb buds appear.",f:"Size: about 3 mm.",s:.5,k:"sesame seed"},
{w:8,n:"Embryo",t:"Fingers and face take shape",d:"All major organs have begun forming. Eyes, ears, fingers and toes become visible.",f:"Size: about 16 mm, like a raspberry.",s:.9,k:"raspberry"},
{w:12,n:"Fetus",t:"End of the first trimester",d:"Now called a fetus. Reflexes begin, kidneys work and the baby can open and close its fists.",f:"Size: about 5 cm, like a lime.",s:1.3,k:"lime"},
{w:20,n:"Fetus",t:"Halfway there",d:"The mother can feel movement (quickening). Hair, nails and a protective coat called vernix develop.",f:"Size: about 25 cm, like a banana.",s:2,k:"banana"},
{w:28,n:"Fetus",t:"Eyes open, brain grows fast",d:"The baby can open its eyes, hear sounds and sense light. Lungs keep maturing.",f:"Size: about 37 cm, like an eggplant.",s:2.6,k:"eggplant"},
{w:36,n:"Fetus",t:"Getting ready",d:"The baby gains weight quickly and usually turns head-down. Lungs are almost ready.",f:"Size: about 47 cm, like a papaya.",s:3.1,k:"papaya"},
{w:40,n:"Birth",t:"Full term",d:"The baby is ready to be born. Contractions push the baby through the birth canal and the first cry fills the lungs with air.",f:"Size: about 50 cm and 3.4 kg.",s:3.4,k:"watermelon"}
];
const Q=[
["When does the heart start beating?",["Week 5","Week 20","Week 30"],0],
["Which hormone do pregnancy tests detect?",["Insulin","hCG","Adrenaline"],1],
["How many chromosomes does a zygote have?",["23","46","92"],1],
["Where does the embryo attach?",["Uterine lining","Stomach","Fallopian tube wall only"],0]
];
const $=id=>document.getElementById(id);
const cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,100);cam.position.set(0,0,9);
sc.add(new THREE.AmbientLight(0xffffff,.7));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(3,4,5);sc.add(dl);
const root=new THREE.Group();sc.add(root);
function wombTex(){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#d9566f';g.fillRect(0,0,512,512);for(let i=0;i<70;i++){g.strokeStyle='rgba(120,10,40,'+(.2+Math.random()*.4)+')';g.lineWidth=1+Math.random()*2.5;g.beginPath();let x=Math.random()*512,y=Math.random()*512;g.moveTo(x,y);for(let j=0;j<6;j++){x+=Math.random()*80-40;y+=Math.random()*80-40;g.lineTo(x,y)}g.stroke()}return new THREE.CanvasTexture(c)}
// womb
const womb=new THREE.Mesh(new THREE.SphereGeometry(3.6,40,40),new THREE.MeshStandardMaterial({map:wombTex(),transparent:true,opacity:.35,side:THREE.DoubleSide,roughness:.4}));
root.add(womb);
const fluid=new THREE.Mesh(new THREE.SphereGeometry(3.4,32,32),new THREE.MeshPhongMaterial({color:0xffc9d6,transparent:true,opacity:.15}));
root.add(fluid);
// placenta
const plac=new THREE.Mesh(new THREE.TorusGeometry(1.2,.45,16,32),new THREE.MeshPhongMaterial({color:0xb3263e}));
plac.position.set(0,2.9,0);plac.rotation.x=Math.PI/2;plac.visible=false;root.add(plac);
// baby
const baby=new THREE.Group();root.add(baby);
const skin=new THREE.MeshStandardMaterial({color:0xf0a894,roughness:.55,emissive:0x5a1a14,emissiveIntensity:.35});
const head=new THREE.Group();head.position.set(0,.85,.1);head.rotation.x=.35;
const sk=new THREE.Mesh(new THREE.SphereGeometry(.62,48,48),skin);sk.scale.set(.95,1.05,1);head.add(sk);
const nose=new THREE.Mesh(new THREE.SphereGeometry(.07,12,12),skin);nose.position.set(0,-.05,.62);head.add(nose);
[-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.14,16,16),skin);e.scale.set(.4,1,.7);e.position.set(s*.6,-.02,0);head.add(e);const ey=new THREE.Mesh(new THREE.SphereGeometry(.09,12,12),new THREE.MeshStandardMaterial({color:0xc98f7d,roughness:.8}));ey.scale.set(1.3,.35,.5);ey.position.set(s*.22,.07,.55);head.add(ey)});
const body=new THREE.Mesh(new THREE.SphereGeometry(.65,48,48),skin);body.scale.set(.9,1.25,.85);body.position.set(0,-.1,0);
const mk=(x,y,z,r)=>{const m=new THREE.Mesh(new THREE.CapsuleGeometry?new THREE.SphereGeometry(r,12,12):new THREE.SphereGeometry(r,12,12),skin);m.position.set(x,y,z);return m};
const limbs=[];
[[-.55,.2,.35],[.55,.2,.35],[-.3,-.85,.3],[.3,-.85,.3]].forEach((p,i)=>{
 const g=new THREE.Group();const l=new THREE.Mesh(new THREE.CylinderGeometry(.14,.11,.8,16),skin);l.position.y=-.35;g.add(l);
 const h=new THREE.Mesh(new THREE.SphereGeometry(i<2?.13:.16,16,16),skin);h.position.y=-.78;if(i>1)h.scale.set(1.2,.7,1.5);g.add(h);
 g.position.set(...p);g.rotation.x=i<2?-1.1:.9;g.rotation.z=i<2?(i?-.3:.3):(i==2?.2:-.2);limbs.push(g);baby.add(g)});
baby.add(head,body);
let orgOn=false,spd=1;
const om=(c,e)=>new THREE.MeshStandardMaterial({color:c,roughness:.5,emissive:e,emissiveIntensity:.5});
const heart=new THREE.Mesh(new THREE.SphereGeometry(.17,24,24),om(0xd7263d,0x7a0012));heart.position.set(0,.3,.25);heart.scale.set(1,1.1,.9);baby.add(heart);
const brain=new THREE.Mesh(new THREE.SphereGeometry(.48,32,32),om(0xf2a7c3,0x6a2a45));brain.scale.set(.95,.8,1);head.add(brain);
const lungs=new THREE.Group();[-1,1].forEach(s=>{const l=new THREE.Mesh(new THREE.SphereGeometry(.2,24,24),om(0x6fa8dc,0x1c3f66));l.scale.set(.6,1.2,.6);l.position.set(s*.27,.3,.12);lungs.add(l)});baby.add(lungs);
[heart,brain,lungs].forEach(o=>o.visible=false);
function orgText(w){if(!orgOn)return '';if(w<5)return 'No organs yet: the embryo is still a cluster of cells.';let t='Heart: beating since week 5.  Brain: growing from the neural tube.';if(w>=12)t+='  Lungs: formed but filled with fluid, they practice breathing movements.';else t+='  Lungs: not formed yet.';return t}
// umbilical cord
const cord=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,0),new THREE.Vector3(.8,1.2,.3),new THREE.Vector3(-.4,2.2,0),new THREE.Vector3(0,2.9,0)]),30,.07,8),new THREE.MeshPhongMaterial({color:0xd9667a}));
root.add(cord);cord.visible=false;
// egg + sperm
const egg=new THREE.Mesh(new THREE.SphereGeometry(1,32,32),new THREE.MeshPhongMaterial({color:0xfff0b3}));root.add(egg);
const sp=[];
for(let i=0;i<14;i++){const g=new THREE.Group();const h=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshPhongMaterial({color:0x6aa9ff}));
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.5,6),new THREE.MeshPhongMaterial({color:0x6aa9ff}));t.position.y=-.28;g.add(h,t);
 g.userData={a:Math.random()*6.28,r:3+Math.random()*2,sp:.4+Math.random()*.5,o:Math.random()*6};sp.push(g);root.add(g)}
// cells (early divisions)
const cells=new THREE.Group();root.add(cells);
for(let i=0;i<16;i++){const c=new THREE.Mesh(new THREE.SphereGeometry(.28,16,16),new THREE.MeshPhongMaterial({color:0xffe08a}));
 const a=Math.acos(1-2*(i+.5)/16),b=Math.PI*(1+Math.sqrt(5))*i;c.position.set(Math.sin(a)*Math.cos(b),Math.sin(a)*Math.sin(b),Math.cos(a)).multiplyScalar(.7);cells.add(c)}
const bub=[];for(let i=0;i<40;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(.04+Math.random()*.05,8,8),new THREE.MeshPhongMaterial({color:0xffffff,transparent:true,opacity:.35}));b.position.set((Math.random()-.5)*5,(Math.random()-.5)*5,(Math.random()-.5)*5);b.userData.s=.2+Math.random()*.4;bub.push(b);root.add(b)}
const glow=new THREE.PointLight(0xff6a5a,1.2,14);glow.position.set(0,0,2);sc.add(glow);
let cur=0,tw=0,auto=false,drag=false,px=0,rotY=0,rotX=0;
function seg(w){let i=0;for(let k=0;k<S.length;k++)if(w>=S[k].w)i=k;return i}
function upd(w){
 const i=seg(w),st=S[i],nx=S[Math.min(i+1,S.length-1)];
 const p=nx.w>st.w?(w-st.w)/(nx.w-st.w):0, size=st.s+(nx.s-st.s)*p;
 $('wk').textContent=Math.floor(w);$('tri').textContent=w<13?'1st trimester':w<27?'2nd trimester':'3rd trimester';
 $('stageName').textContent=st.n;$('title').textContent=st.t;$('desc').textContent=st.d;$('fact').textContent=st.f;
 $('sizeTag').textContent='≈ '+st.k;
 const early=w<2,mid=w>=2&&w<5;
 egg.visible=w<1;sp.forEach(s=>s.visible=w<1);
 cells.visible=w>=1&&w<5;cells.scale.setScalar(.6+Math.min(w,4)*.2);
 baby.visible=w>=5;plac.visible=w>=5;cord.visible=w>=5;
 const k=Math.max(.2,size/3.4*1.5);baby.scale.setScalar(w>=5?Math.max(.15,size/3.4*1.5):.1);
 womb.scale.setScalar(.55+Math.min(w,40)/40*.6);fluid.scale.copy(womb.scale);
 plac.position.y=2.9*womb.scale.x;cord.scale.setScalar(1);
 limbs.forEach((l,j)=>l.visible=w>=8);head.scale.setScalar(w<12?1.4:1);heart.visible=orgOn&&w>=5;brain.visible=orgOn&&w>=5;lungs.visible=orgOn&&w>=12;$('orgInfo').textContent=orgText(w);
}
$('slider').oninput=e=>{auto=false;$('play').textContent='▶ Auto play';tw=+e.target.value;cur=tw;upd(cur)};
$('play').onclick=()=>{auto=!auto;$('play').textContent=auto?'⏸ Pause':'▶ Auto play';if(cur>=40)cur=0};
// drag rotate
cv.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY});
addEventListener('pointerup',()=>drag=false);
let py=0;addEventListener('pointermove',e=>{if(!drag)return;rotY+=(e.clientX-px)*.01;rotX+=(e.clientY-py)*.01;px=e.clientX;py=e.clientY});
// quiz
let qi=0,score=0;
function showQ(){const box=$('quiz');box.classList.remove('hidden');
 if(qi>=Q.length){box.innerHTML=`<p class="font-bold">Score: ${score}/${Q.length}</p><button class="btn text-sm mt-2" id="rq">Retry</button>`;$('rq').onclick=()=>{qi=0;score=0;showQ()};return}
 const q=Q[qi];box.innerHTML=`<p class="font-semibold text-sm mb-2">${qi+1}. ${q[0]}</p>`+q[1].map((o,i)=>`<button data-i="${i}" class="block w-full text-left text-sm border rounded-lg p-2 mb-1">${o}</button>`).join('');
 box.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(+b.dataset.i===q[2]){score++;b.style.background='#16a34a55'}else b.style.background='#dc262655';setTimeout(()=>{qi++;showQ()},700)})}
$('spdBtn').onclick=()=>{spd=spd==1?.5:spd==.5?.25:spd==.25?2:1;$('spdBtn').textContent='Speed: '+spd+'x'};
$('orgBtn').onclick=()=>{orgOn=!orgOn;skin.transparent=orgOn;skin.opacity=orgOn?.22:1;skin.needsUpdate=true;$('orgBtn').textContent='Organs: '+(orgOn?'On':'Off');upd(cur)};
$('quizBtn').onclick=()=>{qi=0;score=0;showQ()};
function rs(){const w=$('stage').clientWidth,h=$('stage').clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();upd(0);
let t0=0;
(function loop(t){requestAnimationFrame(loop);const tt=t/1000;
 if(auto){cur+=.012*spd;if(cur>=40){cur=40;auto=false;$('play').textContent='▶ Auto play'}$('slider').value=cur;upd(cur)}
 if(!drag)rotY+=.0012;root.rotation.y=rotY;root.rotation.x=rotX*.5;
 sp.forEach(s=>{const u=s.userData;const d=Math.max(1.2,u.r-(tt*u.sp*.3+u.o)%u.r*.9);u.a+=.004;s.position.set(Math.cos(u.a)*d,Math.sin(u.a*1.3)*d*.6,Math.sin(u.a)*d*.5);s.lookAt(egg.position)});
 egg.scale.setScalar(1+Math.sin(tt)*.025);
 cells.rotation.y=tt*.2;bub.forEach(b=>{b.position.y+=b.userData.s*.004;if(b.position.y>2.8)b.position.y=-2.8});const hb=1+Math.max(0,Math.sin(tt*8))*.03;heart.scale.set(1+Math.max(0,Math.sin(tt*8))*.25,1.1+Math.max(0,Math.sin(tt*8))*.25,.9);lungs.scale.setScalar(1+Math.sin(tt*.8)*.04);body.scale.set(.9*hb,1.25*hb,.85*hb);glow.intensity=1.1+Math.max(0,Math.sin(tt*8))*.4;
 baby.position.y=Math.sin(tt*.6)*.12;baby.rotation.z=Math.sin(tt*.4)*.08;
 limbs.forEach((l,i)=>{l.rotation.x=(i<2?-1.1:.9)+Math.sin(tt*.9+i*1.7)*.1-(i>1&&cur>=20?Math.pow(Math.max(0,Math.sin(tt*.7)),10)*.8:0)});
 R.render(sc,cam)})(0);
</script>
</body>
</html>
